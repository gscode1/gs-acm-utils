# Consolidated equivalent of testdata/cohorts/basic (parity-tested).
apiVersion: acm-utils.gskode.com/v1alpha1
kind: MockData
metadata:
  name: basic
spec:
  managed:
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: my-config
        namespace: ns-a
        labels:
          color: blue
      data:
        color: blue
        size: "3"
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: other-config
        namespace: ns-b
        labels:
          color: yellow
      data:
        region: eu-west-1
    - apiVersion: v1
      kind: Secret
      metadata:
        name: db-creds
        namespace: ns-a
      type: Opaque
      data:
        password: s3cr3t-plaintext
      stringData:
        username: admin
    - apiVersion: cluster.open-cluster-management.io/v1alpha1
      kind: ClusterClaim
      metadata:
        name: id.k8s.io
      spec:
        value: 7b1c0f4e-8f1d-4f0a-9a57-000000000001
  hub:
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: hub-config
        namespace: policies
      data:
        logLevel: debug
    - apiVersion: cluster.open-cluster-management.io/v1
      kind: ManagedCluster
      metadata:
        name: local-cluster
        labels:
          name: local-cluster
          environment: dev
          vendor: OpenShift
      spec:
        hubAcceptsClient: true
  hubContext:
    clusterName: local-cluster
