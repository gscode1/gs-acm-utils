apiVersion: policy.open-cluster-management.io/v1
kind: ConfigurationPolicy
metadata:
  name: missing-key
spec:
  object-templates:
    - complianceType: musthave
      objectDefinition:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: x
          namespace: ns-a
        data:
          value: '{{ fromConfigMap "ns-a" "my-config" "nope" }}'
