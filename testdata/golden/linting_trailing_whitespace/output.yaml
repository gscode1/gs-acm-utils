apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: trailing-whitespace-test
spec:
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: trailing-whitespace-config
        spec:
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                data:
                  key: Shelby Mustang
                kind: ConfigMap
                metadata:
                  name: test-configmap
          remediationAction: enforce
          severity: low
