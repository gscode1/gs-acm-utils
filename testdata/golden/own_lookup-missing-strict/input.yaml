apiVersion: policy.open-cluster-management.io/v1
kind: ConfigurationPolicy
metadata:
  name: lookup-missing
spec:
  remediationAction: inform
  object-templates:
    - complianceType: musthave
      objectDefinition:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: x
          labels:
            v: '{{ (lookup "v1" "ConfigMap" "default" "no-such-map").metadata.name }}'
