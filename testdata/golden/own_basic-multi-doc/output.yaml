apiVersion: policy.open-cluster-management.io/v1
kind: ConfigurationPolicy
metadata:
  name: multi-one
spec:
  object-templates:
    - complianceType: musthave
      objectDefinition:
        apiVersion: v1
        data:
          color: blue
        kind: ConfigMap
        metadata:
          name: one
          namespace: ns-a
---
apiVersion: policy.open-cluster-management.io/v1
kind: ConfigurationPolicy
metadata:
  name: multi-two
spec:
  object-templates:
    - complianceType: musthave
      objectDefinition:
        apiVersion: v1
        data:
          region: eu-west-1
        kind: ConfigMap
        metadata:
          name: two
          namespace: ns-b
